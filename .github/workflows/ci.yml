name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag capomatic-v1-ci .
      - run: >-
          docker run --rm capomatic-v1-ci python -c
          "import paddleocr; import importlib.metadata as m;
          assert m.version('paddleocr') == '3.7.0';
          assert m.version('paddlepaddle') == '3.2.2'"
      # Gate 1 requires the image to start, not only to build.
      - name: Container serves /health
        run: |
          docker run --rm --detach --name capomatic-ci --publish 7860:7860 capomatic-v1-ci
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:7860/health; then
              docker stop capomatic-ci
              exit 0
            fi
            sleep 5
          done
          docker logs capomatic-ci
          docker stop capomatic-ci
          exit 1
