name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # npm audit over all dependencies (dev included), failing on high/critical
      # except the narrowly scoped exceptions listed in scripts/audit-gate.mjs.
      - name: npm audit (high/critical, with listed exceptions)
        run: node scripts/audit-gate.mjs
      - run: npm run check
      - name: Validate the guest-only Toss export and local bundle
        run: npm run check:toss
        env:
          AIT_APP_NAME: capomatic-ci
          NEXT_PUBLIC_AUTH0_DOMAIN: should-not-load.auth0.com
          NEXT_PUBLIC_AUTH0_CLIENT_ID: toss-build-test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag capomatic-v1-ci .
      - run: >-
          docker run --rm capomatic-v1-ci python -c
          "import paddleocr; import importlib.metadata as m;
          assert m.version('paddleocr') == '3.7.0';
          assert m.version('paddlepaddle') == '3.2.2'"
      # The image must render chords with a font that draws ♭/♯ (DejaVu Sans
      # from fonts-dejavu-core); render.py would silently fall back to ASCII.
      - name: Render font draws ♭/♯
        run: >-
          docker run --rm capomatic-v1-ci python -c
          "from backend.overlay.render import _load_font, _has_accidental_glyphs as g;
          [print(f'{name} size {size}: {f.path if isinstance(getattr(f, \"path\", None), str) else \"<Pillow built-in font>\"} -> \u266d/\u266f glyphs: {g(f)}')
          for name, bold in (('normal', False), ('bold', True))
          for size in (10, 16, 27)
          for f in [_load_font(size, bold=bold)]];
          assert all(g(_load_font(s, bold=b)) for b in (False, True) for s in (10, 16, 27)), 'render font has no glyphs for the accidentals'"
      # Gate 1 requires the image to start, not only to build.
      - name: Container serves /health
        run: |
          docker run --rm --detach --name capomatic-ci --publish 7860:7860 capomatic-v1-ci
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:7860/health; then
              docker stop capomatic-ci
              exit 0
            fi
            sleep 5
          done
          docker logs capomatic-ci
          docker stop capomatic-ci
          exit 1
      # /health does not import paddle; only a real detection proves the image
      # can run OCR (a missing libgomp1 once passed every step above).
      - name: Container runs one real detection
        run: |
          docker run --rm --detach --name capomatic-ocr --publish 7860:7860 capomatic-v1-ci
          for _ in $(seq 1 60); do
            curl --fail --silent http://localhost:7860/health && break
            sleep 5
          done
          status=$(curl --silent --output detect.json --write-out '%{http_code}' \
            --max-time 240 -F "image=@fixtures/images/친구야.jpeg" http://localhost:7860/detect)
          docker logs capomatic-ocr > ocr-container.log 2>&1 || true
          docker stop capomatic-ocr
          echo "HTTP $status"
          if [ "$status" != "200" ]; then tail -n 40 ocr-container.log; exit 1; fi
          python3 -c "import json; n = len(json.load(open('detect.json'))['chords']); print(f'{n} chords'); assert n > 0"
