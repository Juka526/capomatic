name: PR Fast OMR Check

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/omr_v3/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/omr-v3-*.yml'

permissions:
  contents: read

concurrency:
  group: omr-v3-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Regression/smoke budget, not a per-page runtime acceptance gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build --tag capomatic-omr-fast .
      - name: Backend tests including controlled multi-page smoke
        run: docker run --rm capomatic-omr-fast python -m pytest -q
      - name: Fixed clean, ordinary and chord-only cases (gated only)
        run: |
          mkdir -p omr-v3-smoke
          git rev-parse HEAD > omr-v3-smoke/source-revision.txt
          docker run --rm -v "$PWD/omr-v3-smoke:/evidence" capomatic-omr-fast \
            python -m scripts.omr_v3.smoke_fast --out /evidence
      - name: V1 real detection and one V3 API smoke request
        run: |
          docker run --rm --detach --name omr-fast-api --publish 7860:7860 \
            -e CAPOMATIC_ENABLE_OMR_V3=1 -e CAPOMATIC_OMR_REQUIRE_AUTH=0 \
            capomatic-omr-fast
          # Bounded service startup, not CI status monitoring.
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:7860/health; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent --show-error --max-time 240 \
            -F "image=@fixtures/images/친구야.jpeg" http://localhost:7860/detect \
            -o omr-v3-smoke/v1-detect.json
          python3 -c "import json; assert json.load(open('omr-v3-smoke/v1-detect.json'))['chords']"
          # MusicXML exercises HTTP/ZIP/integrity without duplicating the clean OMR pass.
          curl --fail --silent --show-error --max-time 180 \
            -F "file=@tests/omr_v3_eval/synthetic/dev/syn101/score.musicxml" \
            -F semitones=2 -F mode=key http://localhost:7860/api/v3/score/transpose.zip \
            -o omr-v3-smoke/api.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('omr-v3-smoke/api.zip') as archive:
              report = json.loads(archive.read('conversion-report.json'))
              assert report['result_mode'] == 'full_score', report
              assert report['integrity']['ok'] is True, report
              assert {'transposed.pdf', 'recognized.musicxml', 'transposed.musicxml'} <= set(archive.namelist())
          PY
      - name: Container logs and cleanup
        if: always()
        run: |
          mkdir -p omr-v3-smoke
          docker logs omr-fast-api > omr-v3-smoke/api.log 2>&1 || true
          docker stop omr-fast-api || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omr-v3-smoke
          path: omr-v3-smoke
          retention-days: 7
